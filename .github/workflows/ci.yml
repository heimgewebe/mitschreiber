---
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Keep the pinned SHA in sync with documentation and CONTRACTS_REF in validate.yml.
    uses: heimgewebe/metarepo/.github/workflows/reusable-ci.yml@f3524f9b040be957cfead5b80f7a683d0ea6df72
    with:
      run_lint: false
      run_tests: true
