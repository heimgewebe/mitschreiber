---
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Keep the pinned SHA in sync with documentation and CONTRACTS_REF in validate.yml.
    uses: heimgewebe/metarepo/.github/workflows/reusable-ci.yml@9c4caedec6f9e0fef4d1132838c8d8c24c0ba859
    with:
      run_lint: false
      run_tests: true
